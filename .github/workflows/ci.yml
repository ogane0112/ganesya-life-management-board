name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Test (all workspaces)
        run: npm run test --workspaces --if-present

      - name: Build stats-engine
        run: npm run build --workspace=@ganesya/stats-engine --if-present

      - name: Build worker (bundle check via wrangler)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: packages/worker

      - name: Build frontend
        run: npm run build --workspace=@ganesya/frontend
        env:
          VITE_WORKER_URL: https://placeholder.workers.dev/api/status

      - name: Build Storybook
        run: npm run build-storybook --workspace=@ganesya/frontend
