name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/frontend/**"
      - "packages/stats-engine/**"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=@ganesya/frontend
        env:
          # Set this once the Worker is deployed, via either tab under
          # Settings > Secrets and variables > Actions:
          #   Variables > New repository variable, or
          #   Secrets > New repository secret
          #   Name: VITE_WORKER_URL
          #   Value: https://<worker-subdomain>.workers.dev/api/status
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL || secrets.VITE_WORKER_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
